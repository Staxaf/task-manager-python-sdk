# Build Zudoku docs and publish to GitHub Pages.
# Site: https://staxaf.github.io/task-manager-python-sdk/
#
# One-time: Repo Settings → Pages → Source: GitHub Actions

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: python/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

      # Zudoku with basePath writes to dist/<basePath>/. Upload that folder, not dist/.
      # 404.html lives in dist/ — copy it so client-side routes work on Pages.
      - name: Prepare Pages artifact
        run: |
          cp dist/404.html dist/task-manager-python-sdk/404.html
          touch dist/task-manager-python-sdk/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: python/dist/task-manager-python-sdk

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
